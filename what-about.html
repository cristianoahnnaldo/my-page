<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what-about</title>
    <style>
        /* Base Reset & Design Tokens */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-color: #120412;
            --card-bg: rgba(255, 200, 230, 0.08);
            --card-border: rgba(255, 150, 200, 0.2);
            --text-main: #ffffff;
            --text-sub: #f3cedf;
            --accent-purple: #d63031;
            --accent-pink: #ff7675;
            --accent-pink-glow: rgba(255, 118, 117, 0.5);
            --gold: #ffeaa7;
            --container-bg: rgba(35, 10, 30, 0.7);
            --btn-hover: #e84393;
        }

        [data-theme="light"] {
            --bg-color: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 182, 193, 0.4);
            --text-main: #4a1525;
            --text-sub: #7a354b;
            --accent-purple: #fd79a8;
            --accent-pink: #e84393;
            --accent-pink-glow: rgba(232, 67, 147, 0.2);
            --gold: #d63031;
            --container-bg: rgba(255, 255, 255, 0.92);
            --btn-hover: #fd79a8;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 121, 198, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(232, 67, 147, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(162, 155, 254, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            position: relative;
        }

        /* Canvas for Space Background & Mouse Trail */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        #sparkle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
        }

        /* Theme Toggle Button */
        .top-nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-pink-glow);
        }

        /* Main Container */
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px 80px 20px;
        }

        /* Common Section Box */
        .section-box {
            background: var(--container-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
        }

        /* Header & Bouncing Name */
        header {
            text-align: center;
        }

        .space-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(232, 67, 147, 0.4);
        }

        .bouncing-nickname span {
            display: inline-block;
            animation: bounce 1.8s infinite ease-in-out;
            background: linear-gradient(45deg, #ff9ff3, #feca57, #ff6b6b, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bouncing-nickname span:nth-child(1) { animation-delay: 0.0s; }
        .bouncing-nickname span:nth-child(2) { animation-delay: 0.2s; }
        .bouncing-nickname span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            word-break: keep-all;
            line-height: 1.6;
        }

        /* Visitor Welcome Section */
        .welcome-input-group {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .welcome-input-group input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .welcome-input-group input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-pink-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(232, 67, 147, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .welcome-msg {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold);
            min-height: 28px;
            animation: fadeIn 0.5s ease;
        }

        /* 3D Flip Cards (Likes) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        .card-item {
            height: 240px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
        }

        .card-item.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .card-front {
            background: var(--card-bg);
        }

        .card-front .icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .card-item:hover .card-front .icon {
            transform: scale(1.2) rotate(8deg);
        }

        .card-front h3 {
            font-size: 1.3rem;
            color: var(--text-main);
        }

        .card-front .hint {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 8px;
        }

        .card-back {
            background: linear-gradient(135deg, rgba(253, 121, 168, 0.35), rgba(232, 67, 147, 0.35));
            transform: rotateY(180deg);
            word-break: keep-all;
            line-height: 1.5;
        }

        .card-back p {
            font-size: 0.98rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* OX Quiz Section */
        .quiz-container {
            text-align: center;
        }

        .quiz-question {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 14px;
        }

        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .ox-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            font-size: 2.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            color: white;
        }

        .ox-o {
            background: linear-gradient(135deg, #10ac84, #1dd1a1);
        }

        .ox-x {
            background: linear-gradient(135deg, #ee5253, #ff6b6b);
        }

        .ox-btn:hover {
            transform: scale(1.1);
        }

        .quiz-feedback {
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 30px;
            margin-top: 10px;
        }

        .wrong-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Random Cheer Section */
        .cheer-box {
            text-align: center;
        }

        .cheer-display {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--gold);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px dashed var(--card-border);
            word-break: keep-all;
        }

        /* Click Mini-Game Section */
        .game-box {
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-item span {
            color: var(--gold);
            font-size: 1.4rem;
        }

        .click-target-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #fd79a8;
            background: linear-gradient(135deg, #ff9ff3, #ff7675);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(232, 67, 147, 0.4);
            transition: transform 0.05s ease;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .click-target-btn:active {
            transform: scale(0.92);
        }

        .game-result {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-purple);
            min-height: 25px;
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 40px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Media Queries */
        @media (max-width: 600px) {
            .container {
                padding: 40px 15px 60px 15px;
            }
            
            .section-box {
                padding: 25px 18px;
            }

            .ox-btn {
                width: 75px;
                height: 75px;
                font-size: 1.8rem;
            }

            .click-target-btn {
                width: 120px;
                height: 120px;
                font-size: 1.1rem;
            }
        }
    </style>
<style data-studio="css">

.st-bar i{display:block;height:100%;width:0;background:var(--st-accent);transition:width .3s}
.st-cnt{font-size:.9rem;opacity:.75;margin:6px 0 0}
.st-dday,.st-timer{text-align:center;border-radius:20px;background:#f6f6f6;background:color-mix(in srgb,var(--st-accent) 10%,#fff)}
.st-dlabel,.st-tlabel{margin:0;font-weight:700;opacity:.8}

.st-col{min-width:0}
html.st-dark{filter:invert(1) hue-rotate(180deg);background:#fff}

.st-editing .st-prev,.st-editing .st-next{display:none}
